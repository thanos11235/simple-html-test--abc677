<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Info Dashboard</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">GitHub User Information</h1>

        <form id="github-user-form" class="mb-4"> <!-- Using 'github-user-form' for ${seed} requirement -->
            <div class="mb-3">
                <label for="username-input" class="form-label">GitHub Username:</label>
                <input type="text" id="username-input" class="form-control" placeholder="e.g., octocat" required aria-describedby="usernameHelp">
                <div id="usernameHelp" class="form-text">Enter a GitHub username to fetch their account creation date.</div>
            </div>
            <button type="submit" class="btn btn-primary">Get Info</button>
        </form>

        <div id="loading-spinner" class="spinner-border text-primary d-none" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div id="github-created-at" class="alert alert-success d-none" role="alert">
            <!-- Creation date will be displayed here -->
        </div>

        <div id="message" class="alert alert-danger d-none" role="alert">
            <!-- Error messages will be displayed here -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const githubUserForm = document.getElementById('github-user-form');
            const usernameInput = document.getElementById('username-input');
            const githubCreatedAtDiv = document.getElementById('github-created-at');
            const messageDiv = document.getElementById('message');
            const loadingSpinner = document.getElementById('loading-spinner');

            if (!githubUserForm || !usernameInput || !githubCreatedAtDiv || !messageDiv || !loadingSpinner) {
                messageDiv.textContent = 'Error: Missing essential DOM elements.';
                messageDiv.classList.remove('d-none');
                return;
            }

            githubUserForm.addEventListener('submit', async function(event) {
                event.preventDefault(); // Prevent default form submission

                // Clear previous messages and results
                githubCreatedAtDiv.classList.add('d-none');
                messageDiv.classList.add('d-none');
                githubCreatedAtDiv.textContent = '';
                messageDiv.textContent = '';
                loadingSpinner.classList.remove('d-none'); // Show loading spinner

                const username = usernameInput.value.trim();
                if (!username) {
                    messageDiv.textContent = 'Please enter a GitHub username.';
                    messageDiv.classList.remove('d-none');
                    loadingSpinner.classList.add('d-none');
                    return;
                }

                const baseUrl = "https://api.github.com/users/";
                const apiUrl = `${baseUrl}${username}`;
                const headers = {};

                // Check for 'token' in URL query parameters
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                    console.log('Using token from URL for GitHub API request.');
                }

                try {
                    const response = await fetch(apiUrl, { headers: headers });

                    if (!response.ok) {
                        let errorMessage = `GitHub API error: ${response.status}`;
                        try {
                            const errorData = await response.json();
                            if (errorData.message) {
                                errorMessage += ` - ${errorData.message}`;
                            }
                        } catch (jsonError) {
                            // If response is not JSON, use the status text
                            errorMessage += ` - ${response.statusText}`;
                        }
                        throw new Error(errorMessage);
                    }

                    const userData = await response.json();
                    if (userData.created_at) {
                        const createdAtDate = new Date(userData.created_at);
                        // Format to YYYY-MM-DD UTC
                        const formattedDate = createdAtDate.toISOString().split('T')[0];
                        githubCreatedAtDiv.textContent = `Account created on: ${formattedDate} UTC`;
                        githubCreatedAtDiv.classList.remove('d-none');
                        githubCreatedAtDiv.classList.remove('alert-danger'); // Ensure success styling
                        githubCreatedAtDiv.classList.add('alert-success');
                    } else {
                        throw new Error('Could not find creation date for this user.');
                    }
                } catch (error) {
                    messageDiv.textContent = `Error: ${error.message}`;
                    messageDiv.classList.remove('d-none');
                    githubCreatedAtDiv.classList.add('d-none'); // Hide success message on error
                    githubCreatedAtDiv.classList.remove('alert-success');
                    githubCreatedAtDiv.classList.add('alert-danger'); // Show error styling for date div if preferred, though messageDiv is primary.
                } finally {
                    loadingSpinner.classList.add('d-none'); // Hide loading spinner
                }
            });
        });
    </script>
</body>
</html>
